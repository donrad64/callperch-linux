name: Code or build problem
description: Report a reproducible Linux code or build issue using synthetic data.
body:
  - type: markdown
    attributes:
      value: "Do not attach FCC databases, personal addresses, real FRNs, private logs or credentials. Report security issues privately as described in SECURITY.md."
  - type: input
    id: environment
    attributes:
      label: Version, distribution and architecture
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Reproduction steps and expected/actual behavior
    validations:
      required: true
