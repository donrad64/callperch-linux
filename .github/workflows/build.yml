name: Native Linux packages
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        runner: [ubuntu-24.04, ubuntu-24.04-arm]
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    env:
      APP_VERSION: '1.2.3'
      QT_QPA_PLATFORM: offscreen
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.12'
      - name: Install platform libraries
        run: sudo apt-get update && sudo apt-get install -y python3-venv curl libnotify-bin xdg-utils libegl1 libopengl0 libxkbcommon0 libxkbcommon-x11-0 libxcb-cursor0 libxcb-icccm4 libxcb-image0 libxcb-keysyms1 libxcb-render-util0
      - name: Test
        run: |
          python -m pip install -r linux/requirements.txt
          python -m unittest discover -s tests -v
          python linux/test_ui.py -v
      - name: Package
        run: ./scripts/build-linux.sh
      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: CallPerch-${{ matrix.runner }}
          if-no-files-found: error
          retention-days: 14
          path: |
            dist/linux/*.tar.gz
            dist/linux/*.sha256
            dist/linux/*.deb
