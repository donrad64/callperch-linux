name: Native Linux packages
on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'linux/**'
      - 'backend/**'
      - 'tests/**'
      - 'scripts/build-linux.sh'
      - '.github/workflows/build.yml'
permissions:
  contents: read
jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        runner: [ubuntu-24.04, ubuntu-24.04-arm]
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    env:
      APP_VERSION: '1.3.0'
      QT_QPA_PLATFORM: offscreen
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.12'
      - name: Install platform libraries
        run: sudo apt-get update && sudo apt-get install -y python3-venv pulseaudio-utils espeak-ng curl libnotify-bin xdg-utils libegl1 libopengl0 libxkbcommon0 libxkbcommon-x11-0 libxcb-cursor0 libxcb-icccm4 libxcb-image0 libxcb-keysyms1 libxcb-render-util0
      - name: Test
        run: |
          python -m pip install -r linux/requirements.txt
          python -m unittest discover -s tests -v
          python -m unittest discover -s linux -p 'test*.py' -v
      - name: Package
        run: ./scripts/build-linux.sh
      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: CallPerch-${{ matrix.runner }}
          if-no-files-found: error
          retention-days: 14
          path: |
            dist/linux/*.tar.gz
            dist/linux/*.sha256
            dist/linux/*.deb
